<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>月亮郵局 - AI 星星冒險故事機</title>
  <style>
    :root {
      --bg-color: #120e29;
      --card-bg: rgba(255, 255, 255, 0.08);
      --card-border: rgba(255, 255, 255, 0.2);
      --gold: #fde68a;
      --gold-glow: rgba(253, 230, 138, 0.4);
      --text: #f8fafc;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft JhengHei", sans-serif;
      background: linear-gradient(180deg, #100b24 0%, #201a45 60%, #151130 100%);
      color: var(--text);
      min-height: 100vh;
      padding: 20px 16px 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    header {
      text-align: center;
      margin-bottom: 16px;
      position: relative;
      width: 100%;
      max-width: 480px;
    }
    header h1 {
      font-size: 1.8rem;
      color: var(--gold);
      margin-bottom: 6px;
      text-shadow: 0 0 16px var(--gold-glow);
    }
    .status-bar {
      font-size: 0.95rem;
      color: #cbd5e1;
    }
    .status-bar span {
      color: var(--gold);
      font-weight: bold;
    }
    .api-status {
      font-size: 0.8rem;
      color: #94a3b8;
      margin-top: 4px;
      cursor: pointer;
      text-decoration: underline;
    }

    /* 九宮格 */
    .grid-container {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      width: 100%;
      max-width: 480px;
      margin-bottom: 16px;
    }
    .star-card {
      background: var(--card-bg);
      border: 2px solid var(--card-border);
      border-radius: 16px;
      padding: 10px 6px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
      position: relative;
      user-select: none;
    }
    .star-card.selected {
      border-color: var(--gold);
      background: rgba(253, 230, 138, 0.18);
      box-shadow: 0 0 16px var(--gold-glow);
      transform: translateY(-3px) scale(1.02);
    }
    .star-card .badge {
      display: none;
      position: absolute;
      top: -6px;
      right: -6px;
      background: var(--gold);
      color: #120e29;
      font-weight: bold;
      font-size: 0.75rem;
      border-radius: 50%;
      width: 22px;
      height: 22px;
      line-height: 22px;
    }
    .star-card.selected .badge { display: block; }
    .star-card img {
      width: 70px;
      height: 70px;
      object-fit: cover;
      border-radius: 12px;
      margin-bottom: 6px;
      background: rgba(0,0,0,0.2);
    }
    .star-card h4 {
      font-size: 0.95rem;
      color: var(--gold);
    }

    /* 按鈕面板 */
    .action-panel {
      width: 100%;
      max-width: 480px;
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    .btn {
      flex: 1;
      padding: 12px;
      border-radius: 30px;
      border: none;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-create {
      background: var(--gold);
      color: #120e29;
    }
    .btn-create:disabled {
      background: #475569;
      color: #94a3b8;
      cursor: not-allowed;
    }
    .btn-reset {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
      max-width: 90px;
    }

    /* 故事區 */
    .story-card {
      display: none;
      background: rgba(30, 24, 65, 0.9);
      border: 1px solid var(--gold);
      border-radius: 20px;
      width: 100%;
      max-width: 480px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }
    .story-card.active { display: block; }
    .story-title {
      font-size: 1.25rem;
      color: var(--gold);
      margin-bottom: 12px;
      text-align: center;
    }
    .story-text {
      font-size: 1rem;
      line-height: 1.85;
      color: #f1f5f9;
      white-space: pre-wrap;
      margin-bottom: 20px;
    }
    .loading-spinner {
      text-align: center;
      padding: 20px;
      color: var(--gold);
      font-size: 1.05rem;
      display: none;
    }
    .loading-spinner.active { display: block; }
    .audio-controls {
      display: flex;
      justify-content: center;
      gap: 12px;
    }
    .audio-btn {
      padding: 10px 20px;
      border-radius: 20px;
      border: 1px solid var(--gold);
      background: transparent;
      color: var(--gold);
      font-size: 0.95rem;
      cursor: pointer;
      font-weight: bold;
    }
    .audio-btn:hover {
      background: var(--gold);
      color: #120e29;
    }
  </style>
</head>
<body>

  <header>
    <h1>✦ 月亮郵局 AI 故事機 ✦</h1>
    <div class="status-bar" id="statusBar">請選取 <span>3</span> 顆星星夥伴！(已選 0/3)</div>
  </header>

  <div class="grid-container" id="starGrid"></div>

  <div class="action-panel">
    <button class="btn btn-reset" onclick="resetSelection()">重選</button>
    <button class="btn btn-create" id="generateBtn" disabled onclick="handleGenerate()">✨ 創作專屬故事</button>
  </div>

  <div class="loading-spinner" id="loader">✨ 月亮郵局正在為三顆星星編織全新故事中，請稍候...</div>

  <div class="story-card" id="storyArea">
    <h3 class="story-title" id="storyTitle"></h3>
    <div class="story-text" id="storyContent"></div>
    <div class="audio-controls">
      <button class="audio-btn" id="playAudioBtn" onclick="toggleSpeech()">🔊 朗讀故事</button>
      <button class="audio-btn" onclick="stopSpeech()">⏹️ 停止</button>
    </div>
  </div>

  <script>
    const stars = [
      { id: "laugh", name: "笑笑星", img: "assets/star_laugh.png", trait: "帶來歡笑與樂觀", item: "條紋毛帽與大毛球鈴鐺" },
      { id: "guide", name: "守路星", img: "assets/star_guide.png", trait: "認路與辨識方向", item: "探險遮陽帽與星光地圖" },
      { id: "courage", name: "勇氣星", img: "assets/star_courage.png", trait: "勇敢面對黑暗未知", item: "飛行護耳帽與小護盾徽章" },
      { id: "sing", name: "歌歌星", img: "assets/star_sing.png", trait: "用歌聲撫平焦慮", item: "音符項鍊與唱歌大聲公" },
      { id: "fly", name: "飛飛星", img: "assets/star_fly.png", trait: "星空衝刺與先鋒探索", item: "復古護目鏡與圍巾" },
      { id: "glow", name: "微光星", img: "assets/star_glow.png", trait: "溫柔堅毅的希望光芒", item: "橡實針織帽與手提微光燈籠" },
      { id: "calm", name: "安安星", img: "assets/star_calm.png", trait: "放鬆情緒與好夢守護", item: "雲朵睡帽與柔軟雲朵枕頭" },
      { id: "wait", name: "等星星", img: "assets/star_wait.png", trait: "不慌不忙的沉穩耐心", item: "手扶小沙漏與時鐘法杖" },
      { id: "moonlight", name: "月光星", img: "assets/star_moonlight.png", trait: "月夜指引與守護", item: "夜空星紗披風與發光彎月魔杖" }
    ];

    let selectedStars = [];

    // 初始化渲染
    const grid = document.getElementById("starGrid");
    stars.forEach(star => {
      const card = document.createElement("div");
      card.className = "star-card";
      card.id = `card-${star.id}`;
      card.innerHTML = `
        <div class="badge" id="badge-${star.id}"></div>
        <img src="${star.img}" alt="${star.name}" onerror="this.style.opacity='0.2'">
        <h4>${star.name}</h4>
      `;
      card.onclick = () => toggleSelect(star);
      grid.appendChild(card);
    });

    function toggleSelect(star) {
      const idx = selectedStars.findIndex(s => s.id === star.id);
      if (idx > -1) {
        selectedStars.splice(idx, 1);
      } else {
        if (selectedStars.length >= 3) return;
        selectedStars.push(star);
      }
      updateUI();

    }

    function updateUI() {
      stars.forEach(s => {
        const card = document.getElementById(`card-${s.id}`);
        const badge = document.getElementById(`badge-${s.id}`);
        const pos = selectedStars.findIndex(sel => sel.id === s.id);
        if (pos > -1) {
          card.classList.add("selected");
          badge.textContent = pos + 1;
        } else {
          card.classList.remove("selected");
        }
      });

      const count = selectedStars.length;
      document.getElementById("statusBar").innerHTML = 
        count === 3 
          ? `已選齊 <span>3</span> 位夥伴！點擊下方出發冒險！` 
          : `請選取 <span>3</span> 顆星星夥伴！(已選 ${count}/3)`;

      document.getElementById("generateBtn").disabled = count !== 3;
    }

    function resetSelection() {
      selectedStars = [];
      updateUI();
      document.getElementById("storyArea").classList.remove("active");
      document.getElementById("loader").classList.remove("active");
      stopSpeech();
    }

    async function handleGenerate() {
      if (selectedStars.length !== 3) return;
      stopSpeech();

      const loader = document.getElementById("loader");
      const storyArea = document.getElementById("storyArea");
      const generateBtn = document.getElementById("generateBtn");

      loader.classList.add("active");
      storyArea.classList.remove("active");
      generateBtn.disabled = true;

      try {
        const response = await fetch("https://kids-story-api.killua0625.workers.dev/story", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({
            starIds: selectedStars.map(star => star.id)
          })
        });

        const data = await response.json();
        if (data.error) throw new Error(typeof data.error === "string" ? data.error : data.error.message);
        const fullStory = data.story;
        // 分割標題與內文
        const lines = fullStory.split("\n");
        let title = lines[0];
        let content = lines.slice(1).join("\n").trim();
        if (!content) {
          content = fullStory;
          title = `《${selectedStars[0].name}、${selectedStars[1].name} 與 ${selectedStars[2].name} 的星空任務》`;
        }

        document.getElementById("storyTitle").textContent = title.replace(/[#*]/g, '');
        document.getElementById("storyContent").textContent = content;
        storyArea.classList.add("active");
        storyArea.scrollIntoView({ behavior: 'smooth' });

      } catch (err) {
        alert("故事服務發生問題：" + err.message + "\n請稍後再試。");
      } finally {
        loader.classList.remove("active");
        generateBtn.disabled = false;
      }
    }

    // 瀏覽器語音合成
    let synth = window.speechSynthesis;
    let speechChunks = [];
    let speechIndex = 0;
    let isSpeechPaused = false;

    function toggleSpeech() {
      if (!('speechSynthesis' in window)) {
        alert("此瀏覽器不支援語音朗讀，請使用 Chrome 或 Edge！");
        return;
      }
      if (synth.speaking && !synth.paused) {
        synth.pause();
        isSpeechPaused = true;
        document.getElementById("playAudioBtn").textContent = "▶️ 繼續朗讀";
        return;
      }
      if (synth.paused) {
        synth.resume();
        isSpeechPaused = false;
        document.getElementById("playAudioBtn").textContent = "⏸️ 暫停朗讀";
        return;
      }
      if (!speechChunks.length || speechIndex >= speechChunks.length) {
        const text = document.getElementById("storyTitle").textContent + "。\n" + document.getElementById("storyContent").textContent;
        speechChunks = text.match(/[^。！？!?；;\n]+[。！？!?；;\n]?/g) || [text];
        speechIndex = 0;
      }
      isSpeechPaused = false;
      speakNextChunk();
      document.getElementById("playAudioBtn").textContent = "⏸️ 暫停朗讀";
    }

    function speakNextChunk() {
      if (isSpeechPaused) return;
      if (speechIndex >= speechChunks.length) {
        document.getElementById("playAudioBtn").textContent = "🔊 朗讀故事";
        return;
      }
      const chunk = speechChunks[speechIndex++].trim();
      if (!chunk) { speakNextChunk(); return; }
      const nextUtterance = new SpeechSynthesisUtterance(chunk);
      nextUtterance.lang = 'zh-TW';
      nextUtterance.rate = 0.88;
      nextUtterance.onend = () => {
        if (!isSpeechPaused) speakNextChunk();
      };
      nextUtterance.onerror = () => {
        if (!isSpeechPaused) speakNextChunk();
      };
      synth.speak(nextUtterance);
    }

    function stopSpeech() {
      if (synth && synth.speaking) {
        synth.cancel();
      }
      speechChunks = [];
      speechIndex = 0;
      isSpeechPaused = false;
      document.getElementById("playAudioBtn").textContent = "🔊 朗讀故事";
    }
  </script>
</body>
</html>
