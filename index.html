<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>月亮郵局 - AI 星星冒險故事機</title>
  <style>
    :root {
      --bg-color: #120e29;
      --card-bg: rgba(255, 255, 255, 0.08);
      --card-border: rgba(255, 255, 255, 0.2);
      --gold: #fde68a;
      --gold-glow: rgba(253, 230, 138, 0.4);
      --text: #f8fafc;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft JhengHei", sans-serif;
      background-color: #0b1021;
      background-image: url('assets/bg-stars-minimal.jpg');
      background-size: cover;
      background-position: center top;
      background-repeat: no-repeat;
      background-attachment: fixed;
      color: var(--text);
      min-height: 100vh;
      padding: 0 16px 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .paper-shell {
      width: 90%;
      max-width: 440px;
      margin: 16px auto 30px;
      padding: 20px 16px;
      background: #fdfbf7;
      color: #332e2a;
      border-radius: 24px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25), 0 0 0 1px rgba(253, 230, 138, .35);
    }
    .paper-shell.story-mode {
      width: 100%;
      max-width: none;
      min-height: 100vh;
      margin: 0;
      border-radius: 0;
      box-shadow: none;
      padding: max(24px, env(safe-area-inset-top)) max(18px, env(safe-area-inset-right)) max(28px, env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left));
    }
    .paper-shell.story-mode > .grid-container,
    .paper-shell.story-mode > .album-entry,
    .paper-shell.story-mode > .action-panel,
    .paper-shell.story-mode > .loading-spinner { display: none; }
    .paper-shell.story-mode .story-card { max-width: 760px; margin: 0 auto; }
    body.story-reading > #mainHeader { display: none; }
    header {
      text-align: center;
      margin: 24px auto 0;
      position: relative;
      width: 100%;
      max-width: 480px;
    }
    header h1 {
      font-size: 1.8rem;
      color: #ffe082;
      margin-bottom: 6px;
      text-shadow: 0 0 16px var(--gold-glow);
    }
    .status-bar {
      font-size: 0.95rem;
      color: #e0e6ed;
    }
    .status-bar span {
      color: #ffe082;
      font-weight: bold;
    }
    .api-status {
      font-size: 0.8rem;
      color: #e0e6ed;
      margin-top: 4px;
      cursor: pointer;
      text-decoration: underline;
    }

    /* 九宮格 */
    .grid-container {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      width: 100%;
      max-width: 480px;
      margin-bottom: 16px;
      margin-left: auto;
      margin-right: auto;
      padding: 4px;
      border-radius: 20px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.12);
    }
    .star-card {
      background: #fffdf8;
      border: 2px solid #e6d8c5;
      border-radius: 16px;
      padding: 0;
      text-align: center;
      cursor: pointer;
      transition: transform 0.22s cubic-bezier(.2, 1.5, .4, 1), box-shadow 0.22s ease, border-color 0.22s ease;
      position: relative;
      overflow: visible;
      user-select: none;
      aspect-ratio: 1 / 1;
      z-index: 1;
    }
    .star-card.selected {
      border: 2px solid #ffd166;
      background: #fff1c9;
      box-shadow: 0 6px 16px rgba(255, 209, 102, 0.5);
      transform: scale(1.12);
      z-index: 5;
    }
    .star-card .badge {
      display: none;
      position: absolute;
      top: -6px;
      right: -6px;
      background: var(--gold);
      color: #120e29;
      font-weight: bold;
      font-size: 0.75rem;
      border-radius: 50%;
      width: 22px;
      height: 22px;
      line-height: 22px;
    }
    .star-card.selected .badge { display: block; }
    .star-card img {
      width: 100%;
      aspect-ratio: 1 / 1;
      height: 100%;
      object-fit: cover;
      border-radius: 12px;
      display: block;
      margin: 0;
      background: rgba(0,0,0,0.2);
    }
    .star-card h4 {
      font-size: 0.95rem;
      color: #5a3b10;
      display: none;
      position: absolute;
      left: 50%;
      bottom: -13px;
      transform: translateX(-50%);
      z-index: 7;
      white-space: nowrap;
      margin: 0;
      padding: 5px 10px;
      border-radius: 999px;
      background: rgba(255, 250, 235, 0.94);
      box-shadow: 0 3px 9px rgba(74, 43, 32, 0.22);
      pointer-events: none;
    }
    .star-card.selected h4 { display: block; animation: label-pop 0.22s ease-out both; }
    @keyframes label-pop {
      from { opacity: 0; transform: translateX(-50%) translateY(-5px) scale(.85); }
      to { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
    }

    /* 按鈕面板 */
    .action-panel {
      width: 100%;
      max-width: 480px;
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    .btn {
      flex: 1;
      padding: 12px;
      border-radius: 30px;
      border: none;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-create {
      background: var(--gold);
      color: #120e29;
    }
    .btn-create:disabled {
      background: #475569;
      color: #94a3b8;
      cursor: not-allowed;
    }
    .btn-reset {
      background: #e8dccd;
      color: #4a3b31;
      max-width: 90px;
    }

    /* 故事區 */
    .story-card {
      display: none;
      background: transparent;
      border: 0;
      border-radius: 20px;
      width: 100%;
      max-width: 480px;
      padding: 24px 22px;
      box-shadow: none;
    }
    .back-home-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      border: 1px solid #d8b36a;
      border-radius: 999px;
      padding: 8px 13px;
      background: #fff4d6;
      color: #5d4037;
      font-size: .9rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 3px 9px rgba(74, 43, 32, .16);
      margin-bottom: 12px;
    }
    .back-home-btn:hover { background: #f6c026; }
    .story-card.active { display: block; }
    .story-title {
      font-size: 1.45rem;
      color: #7d5214;
      line-height: 1.5;
      margin-bottom: 18px;
      text-align: center;
    }
    .story-text {
      font-size: 1.2rem;
      line-height: 2;
      letter-spacing: 0.025em;
      color: #332e2a;
      text-align: left;
      white-space: pre-wrap;
      margin-bottom: 24px;
    }
    .album-entry { width: 100%; max-width: 480px; margin: 0 auto 18px; display: flex; flex-direction: column; gap: 10px; }
    .album-open { width: 100%; background: #fff4d6; color: #4a2b20; border: 0; box-shadow: 0 5px 14px rgba(0,0,0,.25); }
    .history-open { width: 100%; background: #f7eee2; color: #4a2b20; border: 0; box-shadow: 0 5px 14px rgba(0,0,0,.18); }
    .story-banner { width: 100%; max-height: 280px; object-fit: cover; border-radius: 18px; margin-bottom: 14px; display: none; box-shadow: 0 6px 18px rgba(0,0,0,.3); }
    .story-banner.visible { display: block; }
    .story-meta { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 14px; }
    .companion-tag { border-radius: 999px; padding: 7px 12px; background: #fff4d6; color: #4a2b20; font-size: .85rem; }
    .theme-tag { border-radius: 999px; padding: 7px 12px; background: #f7d6e8; color: #63344d; font-size: .9rem; font-weight: bold; }
    .album-modal { display: none; position: fixed; inset: 0; z-index: 20; background: rgba(12, 8, 31, .86); padding: 24px 14px; overflow-y: auto; }
    .album-modal.open { display: block; }
    .album-panel { max-width: 760px; margin: 0 auto; background: #fff8e8; color: #4a2b20; border-radius: 24px; padding: 20px; min-height: 80vh; }
    .album-heading { display:flex; justify-content:space-between; align-items:center; color:#6b3f2f; margin-bottom: 14px; }
    .album-close { border:0; background:#f2c6a0; color:#4a2b20; border-radius:50%; width:34px; height:34px; cursor:pointer; }
    .album-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:20px; }
    .stamp-card { background:white; padding:10px 10px 14px; box-shadow:0 5px 14px rgba(74,43,32,.25); transform:rotate(var(--tilt)); cursor:pointer; }
    .stamp-card img { width:100%; aspect-ratio:4/3; object-fit:cover; display:block; margin-bottom:10px; }
    .stamp-date { font-size:.8rem; color:#8a6856; }
    .stamp-title { font-weight:bold; margin-top:4px; }
    .stamp-companions { font-size:.8rem; margin-top:5px; color:#6b3f2f; }
    .album-empty { text-align:center; padding:70px 10px; color:#8a6856; }
    .save-toast { position:fixed; left:50%; bottom:24px; transform:translate(-50%,20px); opacity:0; pointer-events:none; background:#fff4d6; color:#4a2b20; padding:12px 18px; border-radius:999px; box-shadow:0 5px 16px rgba(0,0,0,.3); transition:.25s; z-index:30; }
    .save-toast.show { opacity:1; transform:translate(-50%,0); }
    .history-modal { display:none; position:fixed; inset:0; z-index:21; background:rgba(12,8,31,.86); padding:24px 14px; overflow-y:auto; }
    .history-modal.open { display:block; }
    .history-panel { max-width:620px; margin:0 auto; background:#fffaf0; color:#4a2b20; border-radius:22px; padding:20px; min-height:70vh; }
    .history-heading { display:flex; justify-content:space-between; align-items:center; color:#5d4037; margin-bottom:16px; }
    .history-list { display:flex; flex-direction:column; gap:11px; }
    .history-item { width:100%; text-align:left; border:1px solid #dfd0bd; border-radius:14px; background:#fff; padding:14px 16px; color:#4a2b20; cursor:pointer; box-shadow:0 2px 7px rgba(74,43,32,.1); }
    .history-item:hover { background:#fff4df; border-color:#c9a77d; }
    .history-item-title { font-size:1.05rem; font-weight:bold; margin-bottom:7px; }
    .history-item-meta { color:#806b5b; font-size:.86rem; }
    .history-empty, .history-loading { text-align:center; color:#806b5b; padding:60px 12px; }
    .history-reader { display:none; }
    .history-reader.open { display:block; }
    .history-reader-title { font-size:1.4rem; line-height:1.5; color:#5d4037; margin-bottom:12px; }
    .history-reader-meta { color:#806b5b; font-size:.9rem; margin-bottom:16px; }
    .history-reader-text { white-space:pre-wrap; line-height:1.95; font-size:1.08rem; }
    .history-back { border:0; background:#ead8c3; color:#4a2b20; border-radius:999px; padding:9px 14px; cursor:pointer; margin-bottom:14px; }
    .loading-spinner {
      text-align: center;
      padding: 20px;
      color: #8a5a16;
      font-size: 1.05rem;
      display: none;
    }
    .loading-spinner.active { display: block; }
    .audio-controls {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 8px;
    }
    .audio-btn {
      padding: 10px 20px;
      border-radius: 20px;
      border: 1px solid var(--gold);
      background: transparent;
      color: var(--gold);
      font-size: 0.95rem;
      cursor: pointer;
      font-weight: bold;
    }
    #saveStoryBtn {
      border: 1px solid #d8b36a;
      background: #fff1c9;
      color: #5d4037;
      box-shadow: 0 3px 9px rgba(74, 43, 32, .14);
    }
    .audio-player {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border: 1px solid #e3c982;
      border-radius: 16px;
      background: #f5efeb;
      box-shadow: inset 0 1px 2px rgba(74, 43, 32, .06);
    }
    .audio-time { min-width: 42px; color: #555; font-size: 0.78rem; text-align: center; }
    .audio-progress {
      width: 100%;
      accent-color: var(--gold);
      cursor: pointer;
    }
    .audio-player .audio-progress { accent-color: #f6c026; }
    .audio-player .audio-btn { padding: 7px 12px; font-size: 0.85rem; }
    .audio-status { text-align: center; color: #806f61; font-size: 0.82rem; min-height: 1.2em; }
    .audio-btn:hover {
      background: var(--gold);
      color: #120e29;
    }
    .audio-player .audio-btn {
      border: 0;
      background: #f6c026;
      color: #4a3e3d;
      box-shadow: 0 2px 5px rgba(74, 43, 32, .16);
    }
    .story-end-btn {
      width: 100%;
      margin-top: 8px;
      border: 0;
      background: #f6c026;
      color: #4a3e3d;
      box-shadow: 0 4px 10px rgba(74, 43, 32, .18);
    }
    @media (max-width: 560px) {
      body { padding-left: 10px; padding-right: 10px; }
      .paper-shell { margin-top: 16px; margin-bottom: 28px; padding-left: 14px; padding-right: 14px; }
    }
  </style>
</head>
<body>
  <header id="mainHeader">
    <h1>✦ 月亮郵局 AI 故事機 ✦</h1>
    <div class="status-bar" id="statusBar">請選取 <span>3</span> 顆星星夥伴！(已選 0/3)</div>
    <div class="api-status" id="quotaStatus">今日剩餘故事次數：15 次</div>
  </header>

<main class="paper-shell">

  <div class="grid-container" id="starGrid"></div>

  <div class="album-entry">
    <button class="btn album-open" onclick="openAlbum()">📬 翻開月亮集郵冊</button>
    <button class="btn history-open" onclick="openHistory()">📜 讀以前的冒險故事</button>
  </div>

  <div class="action-panel">
    <button class="btn btn-reset" onclick="resetSelection()">重選</button>
    <button class="btn btn-create" id="generateBtn" disabled onclick="handleGenerate()">✨ 創作專屬故事</button>
  </div>

  <div class="loading-spinner" id="loader">✨ 月亮郵局正在為三顆星星編織全新故事中，請稍候...</div>

  <div class="story-card" id="storyArea">
    <button class="back-home-btn" type="button" onclick="backHome()">🔙 回首頁</button>
    <img class="story-banner" id="storyBanner" alt="本次冒險插畫">
    <div class="story-meta" id="storyMeta"></div>
    <button class="audio-btn" id="saveStoryBtn" onclick="saveCurrentStory()">💾 收藏到魔法相簿</button>
    <h3 class="story-title" id="storyTitle"></h3>
    <div class="audio-controls">
      <div class="audio-player" aria-label="故事朗讀播放器">
        <button class="audio-btn" id="playAudioBtn" onclick="toggleSpeech()">▶️ 播放</button>
        <input class="audio-progress" id="speechProgress" type="range" min="0" max="100" value="0" step="0.1" aria-label="朗讀進度">
        <span class="audio-time" id="speechTime">0:00 / 0:00</span>
      </div>
      <div class="audio-status" id="speechStatus" aria-live="polite">準備朗讀</div>
    </div>
    <div class="story-text" id="storyContent"></div>
    <button class="btn story-end-btn" type="button" onclick="backHome()">✨ 再聽一個故事（回到首頁）</button>
  </div>
</main>

  <div class="album-modal" id="albumModal" onclick="closeAlbumOnBackdrop(event)">
    <section class="album-panel">
      <div class="album-heading"><h2>🌙 月亮集郵冊</h2><button class="album-close" onclick="closeAlbum()">×</button></div>
      <div class="album-grid" id="albumGrid"></div>
    </section>
  </div>
  <div class="history-modal" id="historyModal" onclick="closeHistoryOnBackdrop(event)">
    <section class="history-panel">
      <div class="history-heading"><h2>📖 冒險故事回憶錄</h2><button class="album-close" onclick="closeHistory()">×</button></div>
      <div id="historyListView">
        <div class="history-list" id="historyList"></div>
      </div>
      <div class="history-reader" id="historyReader">
        <button class="history-back" onclick="showHistoryList()">← 返回故事清單</button>
        <h3 class="history-reader-title" id="historyReaderTitle"></h3>
        <div class="history-reader-meta" id="historyReaderMeta"></div>
        <div class="history-reader-text" id="historyReaderText"></div>
      </div>
    </section>
  </div>
  <div class="save-toast" id="saveToast">✨ 已收藏到月亮集郵冊！</div>

  <script>
    const stars = [
      { id: "laugh", name: "笑笑星", img: "assets/star_laugh.png", trait: "帶來歡笑與樂觀", item: "條紋毛帽與大毛球鈴鐺" },
      { id: "guide", name: "守路星", img: "assets/star_guide.png", trait: "認路與辨識方向", item: "探險遮陽帽與星光地圖" },
      { id: "courage", name: "勇氣星", img: "assets/star_courage.png", trait: "勇敢面對黑暗未知", item: "飛行護耳帽與小護盾徽章" },
      { id: "sing", name: "歌歌星", img: "assets/star_sing.png", trait: "用歌聲撫平焦慮", item: "音符項鍊與唱歌大聲公" },
      { id: "fly", name: "飛飛星", img: "assets/star_fly.png", trait: "星空衝刺與先鋒探索", item: "復古護目鏡與圍巾" },
      { id: "glow", name: "微光星", img: "assets/star_glow.png", trait: "溫柔堅毅的希望光芒", item: "橡實針織帽與手提微光燈籠" },
      { id: "calm", name: "安安星", img: "assets/star_calm.png", trait: "放鬆情緒與好夢守護", item: "雲朵睡帽與柔軟雲朵枕頭" },
      { id: "wait", name: "等星星", img: "assets/star_wait.png", trait: "不慌不忙的沉穩耐心", item: "手扶小沙漏與時鐘法杖" },
      { id: "moonlight", name: "月光星", img: "assets/star_moonlight.png", trait: "月夜指引與守護", item: "夜空星紗披風與發光彎月魔杖" }
    ];

    let selectedStars = [];
    let currentStoryRecord = null;
    const ALBUM_KEY = "moon_story_album_v1";

    function getLocalAlbum() {
      try { return JSON.parse(localStorage.getItem(ALBUM_KEY) || "[]"); } catch { return []; }
    }
    function saveAlbum(records) { localStorage.setItem(ALBUM_KEY, JSON.stringify(records.slice(0, 50))); }
    function formatStoryDate(value) {
      const date = value ? new Date(value) : new Date();
      if (Number.isNaN(date.getTime())) return String(value || "");
      return date.toLocaleString("zh-TW", {
        year: "numeric", month: "2-digit", day: "2-digit",
        hour: "2-digit", minute: "2-digit", hour12: false
      }).replaceAll("/", ".").replace(", ", " ");
    }
    function showToast(message) {
      const toast = document.getElementById("saveToast"); toast.textContent = message; toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 2200);
    }
    async function saveCurrentStory(silent = false) {
      if (!currentStoryRecord) return;
      const records = getLocalAlbum();
      try {
        const response = await fetch("https://kids-story-api.killua0625.workers.dev/api/family_album", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(currentStoryRecord) });
        const data = await response.json();
        if (!response.ok || data.error) throw new Error(data.error || "相簿儲存失敗");
        saveAlbum(data.album || [currentStoryRecord, ...records]);
        await renderAlbum();
        if (!silent) showToast(records.some(item => item.id === currentStoryRecord.id) ? "✨ 已同步到雲端月亮集郵冊！" : "✨ 已收藏到雲端月亮集郵冊！");
      } catch { saveAlbum([currentStoryRecord, ...records]); if (!silent) showToast("⚠️ 雲端收藏失敗，已暫存本機"); }
    }
    async function renderAlbum() {
      const grid = document.getElementById("albumGrid"); let records = [];
      try {
        const response = await fetch("https://kids-story-api.killua0625.workers.dev/api/family_album");
        const data = await response.json();
        if (!response.ok || data.error) throw new Error(data.error || "相簿讀取失敗");
        records = Array.isArray(data.album) ? data.album : [];
        saveAlbum(records);
      }
      catch { records = getLocalAlbum(); }
      grid.innerHTML = "";
      if (!records.length) { grid.innerHTML = '<div class="album-empty">📭 還沒有冒險紀念郵票<br>產生故事後，按下收藏就會出現在這裡。</div>'; return; }
      records.forEach((item, index) => {
        const card = document.createElement("article"); card.className = "stamp-card"; card.style.setProperty("--tilt", `${[-2, 1.5, -1, 2][index % 4]}deg`);
        card.innerHTML = `<img src="${item.imageUrl || "assets/star_moonlight.png"}" alt="${item.title}"><div class="stamp-date">📅 ${formatStoryDate(item.date)}</div><div class="stamp-title">🏷️ ${item.theme || "月亮郵局冒險"}</div><div class="stamp-companions">${item.title}<br>${(item.companions || []).join("、")}</div>`;
        card.onclick = () => window.open(item.imageUrl || "assets/star_moonlight.png", "_blank"); grid.appendChild(card);
      });
    }
    function openAlbum() { renderAlbum(); document.getElementById("albumModal").classList.add("open"); }
    function closeAlbum() { document.getElementById("albumModal").classList.remove("open"); }
    function closeAlbumOnBackdrop(event) { if (event.target.id === "albumModal") closeAlbum(); }
    async function getAlbumRecords() {
      try {
        const response = await fetch("https://kids-story-api.killua0625.workers.dev/api/family_album");
        const data = await response.json();
        if (!response.ok || data.error) throw new Error(data.error || "故事讀取失敗");
        const records = Array.isArray(data.album) ? data.album : [];
        saveAlbum(records);
        return records;
      } catch { return getLocalAlbum(); }
    }
    async function openHistory() {
      document.getElementById("historyModal").classList.add("open");
      showHistoryList();
      const list = document.getElementById("historyList");
      list.innerHTML = '<div class="history-loading">🌙 正在翻找月亮郵局的故事紀錄...</div>';
      const records = await getAlbumRecords();
      list.innerHTML = "";
      if (!records.length) {
        list.innerHTML = '<div class="history-empty">📭 還沒有以前的冒險故事<br>收藏故事後，就會在這裡留下紀錄。</div>';
        return;
      }
      records.forEach(record => {
        const item = document.createElement("button");
        item.className = "history-item";
        const title = document.createElement("div");
        title.className = "history-item-title";
        title.textContent = record.title || "月亮郵局的冒險";
        const meta = document.createElement("div");
        meta.className = "history-item-meta";
        meta.textContent = `📅 ${formatStoryDate(record.date)} ｜ 🐾 ${(record.companions || []).join("、")}`;
        item.append(title, meta);
        item.onclick = () => openHistoryStory(record);
        list.appendChild(item);
      });
    }
    function openHistoryStory(record) {
      document.getElementById("historyListView").style.display = "none";
      document.getElementById("historyReader").classList.add("open");
      document.getElementById("historyReaderTitle").textContent = record.title || "月亮郵局的冒險";
      document.getElementById("historyReaderMeta").textContent = `🏷️ ${record.theme || "月亮郵局冒險"} ｜ 📅 ${formatStoryDate(record.date)} ｜ 🐾 ${(record.companions || []).join("、")}`;
      document.getElementById("historyReaderText").textContent = record.story || "這篇故事還沒有保存文字內容。";
    }
    function showHistoryList() {
      document.getElementById("historyListView").style.display = "block";
      document.getElementById("historyReader").classList.remove("open");
    }
    function closeHistory() { document.getElementById("historyModal").classList.remove("open"); }
    function closeHistoryOnBackdrop(event) { if (event.target.id === "historyModal") closeHistory(); }
    renderAlbum();
    const storyClientId = localStorage.getItem("moon_story_client_id") || (() => {
      const id = `${crypto.randomUUID().replace(/-/g, "")}${Date.now()}`;
      localStorage.setItem("moon_story_client_id", id);
      return id;
    })();

    // 初始化渲染
    const grid = document.getElementById("starGrid");
    stars.forEach(star => {
      const preload = new Image();
      preload.decoding = "async";
      preload.src = star.img;
      const card = document.createElement("div");
      card.className = "star-card";
      card.id = `card-${star.id}`;
      card.innerHTML = `
        <div class="badge" id="badge-${star.id}"></div>
        <img src="${star.img}" alt="${star.name}" onerror="this.style.opacity='0.2'">
        <h4>${star.name}</h4>
      `;
      card.onclick = () => toggleSelect(star);
      grid.appendChild(card);
    });

    loadQuotaStatus();

    async function loadQuotaStatus() {
      try {
        const response = await fetch("https://kids-story-api.killua0625.workers.dev/usage", {
          headers: { "X-Story-Client": storyClientId }
        });
        const data = await response.json();
        if (typeof data.remaining === "number") {
          document.getElementById("quotaStatus").textContent = `今日剩餘故事次數：${data.remaining} 次`;
        }
      } catch {
        document.getElementById("quotaStatus").textContent = "今日剩餘故事次數：暫時無法查詢";
      }
    }

    function toggleSelect(star) {
      const idx = selectedStars.findIndex(s => s.id === star.id);
      if (idx > -1) {
        selectedStars.splice(idx, 1);
      } else {
        if (selectedStars.length >= 3) return;
        selectedStars.push(star);
      }
      updateUI();
    }

    function updateUI() {
      stars.forEach(s => {
        const card = document.getElementById(`card-${s.id}`);
        const badge = document.getElementById(`badge-${s.id}`);
        const pos = selectedStars.findIndex(sel => sel.id === s.id);
        if (pos > -1) {
          card.classList.add("selected");
          badge.textContent = pos + 1;
        } else {
          card.classList.remove("selected");
        }
      });

      const count = selectedStars.length;
      document.getElementById("statusBar").innerHTML = 
        count === 3 
          ? `已選齊 <span>3</span> 位夥伴！點擊下方出發冒險！` 
          : `請選取 <span>3</span> 顆星星夥伴！(已選 ${count}/3)`;

      document.getElementById("generateBtn").disabled = count !== 3;
    }

    function resetSelection() {
      selectedStars = [];
      updateUI();
      document.body.classList.remove("story-reading");
      document.querySelector(".paper-shell").classList.remove("story-mode");
      document.getElementById("storyArea").classList.remove("active");
      document.getElementById("loader").classList.remove("active");
      stopSpeech();
    }

    function backHome() {
      resetSelection();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    async function handleGenerate() {
      if (selectedStars.length !== 3) return;
      stopSpeech();

      const loader = document.getElementById("loader");
      const storyArea = document.getElementById("storyArea");
      const generateBtn = document.getElementById("generateBtn");

      loader.classList.add("active");
      storyArea.classList.remove("active");
      document.querySelector(".paper-shell").classList.remove("story-mode");
      generateBtn.disabled = true;

      try {
        document.body.classList.remove("story-reading");
        const response = await fetch("https://kids-story-api.killua0625.workers.dev/story", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({
            starIds: selectedStars.map(star => star.id),
            clientId: storyClientId
          })
        });

        const data = await response.json();
        if (typeof data.remaining === "number") {
          document.getElementById("quotaStatus").textContent = `今日剩餘故事次數：${data.remaining} 次`;
        }
        if (!response.ok || data.error) throw new Error(typeof data.error === "string" ? data.error : (data.error?.message || `Worker 請求失敗（HTTP ${response.status}）`));
        const fullStory = data.story || "";
        // 分割標題與內文
        const lines = fullStory.split("\n");
        let title = lines[0];
        let content = lines.slice(1).join("\n").trim();
        if (/^主題\s*[：:]/.test(lines[0]) && /^標題\s*[：:]/.test(lines[1] || "")) {
          content = lines.slice(2).join("\n").trim();
        }
        if (!content) {
          content = fullStory;
          title = `《${selectedStars[0].name}、${selectedStars[1].name} 與 ${selectedStars[2].name} 的星空任務》`;
        }

        title = (data.title || title).replace(/[#*]/g, '');
        const companions = data.companions || selectedStars.map(star => star.name);
        const theme = (data.theme || "月亮郵局的溫柔冒險").trim();
        currentStoryRecord = { id: `${Date.now()}-${title}`, title, theme, story: content, imageUrl: data.imageUrl || "", date: data.date || new Date().toISOString(), companions };
        document.getElementById("storyTitle").textContent = title;
        document.getElementById("storyContent").textContent = content;
        const banner = document.getElementById("storyBanner");
        if (data.imageUrl) {
          banner.src = data.imageUrl;
          banner.classList.add("visible");
          // 圖片現在在背景生成，若第一次載入太早，稍後再試一次。
          banner.onerror = () => setTimeout(() => { banner.src = `${data.imageUrl}?retry=${Date.now()}`; }, 1800);
        } else { banner.removeAttribute("src"); banner.classList.remove("visible"); }
        document.getElementById("storyMeta").innerHTML = `<span class="theme-tag">🏷️ 主題：${theme}</span>` + companions.map(name => `<span class="companion-tag">這次的冒險夥伴：${name}</span>`).join("");
        storyArea.classList.add("active");
        document.body.classList.add("story-reading");
        document.querySelector(".paper-shell").classList.add("story-mode");
        storyArea.scrollIntoView({ behavior: 'smooth' });
        // 每次產生成功後立即同步到雲端，讓不同手機、電腦都能看到同一份故事紀錄。
        void saveCurrentStory(true);

      } catch (err) {
        alert("故事服務發生問題：" + err.message + "\n請稍後再試。");
      } finally {
        loader.classList.remove("active");
        generateBtn.disabled = false;
      }
    }

    // 瀏覽器語音合成
    let synth = window.speechSynthesis;
    let speechChunks = [];
    let speechIndex = 0;
    let speechPlaying = false;
    let speechTimer = null;
    let speechStartedAt = 0;
    let speechElapsedBefore = 0;
    let speechDurations = [];
    let speechTotal = 0;
    let activeSpeechIndex = -1;

    function formatTime(seconds) {
      seconds = Math.max(0, Math.round(seconds));
      return `${Math.floor(seconds / 60)}:${String(seconds % 60).padStart(2, "0")}`;
    }

    function updateSpeechProgress(seconds = speechElapsedBefore) {
      const progress = document.getElementById("speechProgress");
      const time = document.getElementById("speechTime");
      const safe = Math.min(speechTotal, Math.max(0, seconds));
      progress.value = speechTotal ? (safe / speechTotal) * 100 : 0;
      time.textContent = `${formatTime(safe)} / ${formatTime(speechTotal)}`;
    }

    function chooseStoryVoice() {
      const voices = synth.getVoices();
      const preferred = [
        /Microsoft.*(Xiaoxiao|HsiaoChen|HsiaoYu|Yunxi|Yunyang)/i,
        /Google.*(國語|普通話|Mandarin)/i,
        /Apple.*(Mei-Jia|Ting-Ting|Sin-Ji)/i
      ];
      for (const pattern of preferred) {
        const match = voices.find(voice => pattern.test(voice.name) && /^zh/i.test(voice.lang));
        if (match) return match;
      }
      return voices.filter(voice => /^zh/i.test(voice.lang))
        .sort((a, b) => Number(b.localService) - Number(a.localService))[0];
    }

    function prepareSpeech() {
      const text = (document.getElementById("storyTitle").textContent + "。\n" + document.getElementById("storyContent").textContent)
        .replace(/[「」『』“”\"']/g, "")
        .replace(/……/g, "，嗯……");
      speechChunks = text.match(/[^。！？!?；;，,\n]+[。！？!?；;，,\n]?/g) || [text];
      speechDurations = speechChunks.map(chunk => Math.max(1.2, chunk.trim().length * 0.28));
      speechTotal = speechDurations.reduce((sum, value) => sum + value, 0);
      speechIndex = 0;
      speechElapsedBefore = 0;
      updateSpeechProgress();
    }

    function toggleSpeech() {
      if (!('speechSynthesis' in window)) {
        alert("此瀏覽器不支援語音朗讀，請使用 Chrome 或 Edge！");
        return;
      }
      if (speechPlaying) {
        synth.cancel();
        speechPlaying = false;
        clearInterval(speechTimer);
        speechIndex = Math.max(0, activeSpeechIndex);
        document.getElementById("playAudioBtn").textContent = "▶️ 繼續";
        document.getElementById("speechStatus").textContent = "已暫停（按繼續播放）";
        return;
      }
      if (!speechChunks.length || speechIndex >= speechChunks.length) prepareSpeech();
      speechPlaying = true;
      speakNextChunk();
      document.getElementById("playAudioBtn").textContent = "⏸️ 暫停";
      document.getElementById("speechStatus").textContent = "正在朗讀";
    }

    function speakNextChunk() {
      if (speechIndex >= speechChunks.length) {
        speechPlaying = false;
        clearInterval(speechTimer);
        speechElapsedBefore = speechTotal;
        updateSpeechProgress();
        document.getElementById("playAudioBtn").textContent = "▶️ 播放";
        document.getElementById("speechStatus").textContent = "朗讀完成";
        return;
      }
      const currentIndex = speechIndex;
      activeSpeechIndex = currentIndex;
      const chunk = speechChunks[speechIndex++].trim();
      if (!chunk) { speakNextChunk(); return; }
      const nextUtterance = new SpeechSynthesisUtterance(chunk);
      const voice = chooseStoryVoice();
      if (voice) nextUtterance.voice = voice;
      nextUtterance.lang = voice?.lang || 'zh-TW';
      nextUtterance.rate = 0.6;
      nextUtterance.pitch = 1.0;
      nextUtterance.volume = 1.0;
      speechStartedAt = Date.now();
      clearInterval(speechTimer);
      speechTimer = setInterval(() => {
        updateSpeechProgress(speechElapsedBefore + (Date.now() - speechStartedAt) / 1000);
      }, 100);
      nextUtterance.onend = () => {
        clearInterval(speechTimer);
        speechElapsedBefore += speechDurations[currentIndex] || 0;
        if (speechPlaying) speakNextChunk();
      };
      nextUtterance.onerror = () => {
        clearInterval(speechTimer);
        if (speechPlaying) speakNextChunk();
      };
      synth.speak(nextUtterance);
    }

    document.getElementById("speechProgress").addEventListener("input", event => {
      if (!speechChunks.length) return;
      const wasPlaying = speechPlaying;
      synth.cancel();
      speechPlaying = false;
      clearInterval(speechTimer);
      const target = (Number(event.target.value) / 100) * speechTotal;
      speechElapsedBefore = 0;
      speechIndex = 0;
      activeSpeechIndex = -1;
      while (speechIndex < speechDurations.length && speechElapsedBefore + speechDurations[speechIndex] < target) {
        speechElapsedBefore += speechDurations[speechIndex++];
      }
      updateSpeechProgress(target);
      if (wasPlaying) {
        speechPlaying = true;
        speakNextChunk();
      }
    });

    function stopSpeech() {
      if (synth && synth.speaking) {
        synth.cancel();
      }
      speechChunks = [];
      speechIndex = 0;
      activeSpeechIndex = -1;
      speechPlaying = false;
      speechElapsedBefore = 0;
      speechTotal = 0;
      clearInterval(speechTimer);
      updateSpeechProgress();
      document.getElementById("playAudioBtn").textContent = "▶️ 播放";
      document.getElementById("speechStatus").textContent = "準備朗讀";
    }
  </script>
</body>
</html>
